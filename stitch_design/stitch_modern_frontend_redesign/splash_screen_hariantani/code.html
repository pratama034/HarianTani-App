<script>
  (function() {
    const statusMessages = [
      "Memuat data enkripsi lokal & keystore...",
      "Sinkronisasi telemetry tanah & mikroklimat...",
      "Mengaktifkan modul kalender masa tanam...",
      "Hardware keystore siap • Siap berkebun!"
    ];

    let currentIdx = 1;
    const statusTextElem = document.getElementById("boot-status-text");
    const percentElem = document.getElementById("load-percentage");
    const barElem = document.getElementById("progress-indicator");
    const enterBtn = document.getElementById("btn-enter");

    const timer = setInterval(() => {
      currentIdx = (currentIdx + 1) % statusMessages.length;
      if (statusTextElem) {
        statusTextElem.textContent = statusMessages[currentIdx];
      }

      if (currentIdx === statusMessages.length - 1) {
        if (percentElem) percentElem.textContent = "100%";
        if (barElem) barElem.style.width = "100%";
        clearInterval(timer);
      } else {
        const nextVal = Math.min(96, 75 + currentIdx * 9);
        if (percentElem) percentElem.textContent = nextVal + "%";
        if (barElem) barElem.style.width = nextVal + "%";
      }
    }, 1800);

    if (enterBtn) {
      enterBtn.addEventListener("click", () => {
        enterBtn.classList.add("opacity-80");
        enterBtn.innerHTML = `
          <span class="material-symbols-outlined text-[18px] animate-spin">refresh</span>
          <span>Membuka Dasbor...</span>
        `;
      });
    }
  })();
</script></main>
